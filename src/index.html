<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- apply saved preferences before first paint (dark theme, fancy mode off by default) -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
        document.documentElement.dataset.fancy = localStorage.getItem("fancy") || "off";
      } catch (e) {}
    </script>

    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/index.css">

    <title>WitchSoft</title>

    <!-- favicon setup -->
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="icon" sizes="16x16 32x32 64x64" href="images/favicon.ico">
    <link rel="icon" type="image/png" sizes="196x196" href="images/favicon-192.png">
    <link rel="icon" type="image/png" sizes="160x160" href="images/favicon-160.png">
    <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96.png">
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
    <link rel="apple-touch-icon" href="images/favicon-57.png">
    <link rel="apple-touch-icon" sizes="114x114" href="images/favicon-114.png">
    <link rel="apple-touch-icon" sizes="72x72" href="images/favicon-72.png">
    <link rel="apple-touch-icon" sizes="144x144" href="images/favicon-144.png">
    <link rel="apple-touch-icon" sizes="60x60" href="images/favicon-60.png">
    <link rel="apple-touch-icon" sizes="120x120" href="images/favicon-120.png">
    <link rel="apple-touch-icon" sizes="76x76" href="images/favicon-76.png">
    <link rel="apple-touch-icon" sizes="152x152" href="images/favicon-152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta name="msapplication-TileImage" content="images/favicon-144.png">
    <meta name="msapplication-config" content="/browserconfig.xml">
  </head>

  <body>
    <canvas id="fancy-background" aria-hidden="true"></canvas>

    <nav class="switches" aria-label="Display settings">
      <button id="fancy-switch" type="button" aria-pressed="false" title="Fancy mode">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
          <circle cx="12" cy="12" r="2.2"/>
        </svg>
        <span>fancy</span>
      </button>
      <button id="theme-switch" type="button" title="Toggle light / dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <span class="visually-hidden">Toggle light / dark theme</span>
      </button>
    </nav>

    <main>
      <figure class="logo">
        <img src="images/logo_placeholder.webp" alt="WitchSoft's logo placeholder" width="549" height="600">
      </figure>

      <header>
        <h1>WitchSoft</h1>
      </header>

      <section class="tagline">
        <p>Apps you can use with joy,</p>
        <p>made with automation that's like magic.</p>
      </section>

      <p class="authors">A project by <a href="https://www.linkedin.com/in/michal-bultrowicz/">Michał Bultrowicz</a> and his machines (and the occasional contractor).</p>

      <section class="links">
        <div>
          <h3>Products</h3>
          <p><a href="https://pitowalut.pl">PITowalut.pl</a></p>
        </div>

        <div>
          <h3>Get notifications</h3>
          <p><a href="atom.xml">Atom feed</a></p>
          <p><a href="https://twitter.com/witch_soft">Twitter</a></p>
        </div>
      </section>
    </main>

    <script src="js/switches.js"></script>
  </body>
</html>
